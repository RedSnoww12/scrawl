<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scrawl Whiteboard</title>
<meta name="description" content="A hand-drawn style whiteboard with sketchy shapes, arrows, freehand ink and multiple boards.">
<meta name="theme-color" content="#fcfcfd">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232f5bea' stroke-width='2' stroke-linecap='round'%3E%3Cpath d='M4 20l1-4.5L15.5 5a2.1 2.1 0 013 3L8 18.5zM13.5 7l3 3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&family=Kalam:wght@400;700&display=swap">
<style>
/* Layout: full-bleed dot-paper canvas; floating islands for tools (top), properties (left), view controls (bottom). */
:root {
  --bg: #fcfcfd;
  --ui: #ffffff;
  --ui-2: #f0f2f8;
  --line: #d8dce8;
  --ink: #1b2130;
  --muted: #5d6577;
  --accent: #2f5bea;
  --accent-soft: #e2e8ff;
  --danger: #c92a2a;
  --shadow: 0 1px 2px rgba(20, 30, 60, .06), 0 8px 24px rgba(20, 30, 60, .09);
  --canvas-filter: none;
  --font-brand: "Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --font-ui: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-hand: "Kalam", "Comic Sans MS", cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131519; --ui: #1c2029; --ui-2: #262b37; --line: #343a4a; --ink: #e8ebf2; --muted: #9aa3b5;
    --accent: #8ea6ff; --accent-soft: #29335a; --danger: #ff8787;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
    --canvas-filter: invert(92%) hue-rotate(180deg);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131519; --ui: #1c2029; --ui-2: #262b37; --line: #343a4a; --ink: #e8ebf2; --muted: #9aa3b5;
  --accent: #8ea6ff; --accent-soft: #29335a; --danger: #ff8787;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
  --canvas-filter: invert(92%) hue-rotate(180deg);
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-ui); overflow: hidden;
  -webkit-user-select: none; user-select: none; overscroll-behavior: none;
}
#board { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; filter: var(--canvas-filter); display: block; }

.island {
  background: var(--ui); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow);
}
button { font: inherit; color: inherit; }
.icon-btn {
  width: 36px; height: 36px; display: inline-grid; place-items: center; border: 0; border-radius: 8px;
  background: transparent; cursor: pointer; color: var(--ink); flex: none;
}
.icon-btn:hover { background: var(--ui-2); }
.icon-btn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.icon-btn:disabled { opacity: .35; cursor: default; background: transparent; }
.icon-btn svg { width: 20px; height: 20px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* top bar */
#topbar {
  position: fixed; top: calc(12px + env(safe-area-inset-top, 0px));
  left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; pointer-events: none;
}
#topbar > * { pointer-events: auto; }
.brand { display: flex; align-items: center; gap: 4px; padding: 4px; }
.brand-name { font-family: var(--font-brand); font-weight: 700; font-size: 17px; letter-spacing: -.01em; padding: 0 10px 0 4px; }
#tools { display: flex; gap: 2px; padding: 4px; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
#tools::-webkit-scrollbar { display: none; }
.sep { width: 1px; background: var(--line); margin: 6px 4px; flex: none; }
.spacer { width: 120px; flex: none; }

/* menu */
#menu { position: fixed; top: calc(60px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); width: 240px; padding: 6px; z-index: 20; }
#menu button {
  width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 8px 10px; border: 0; border-radius: 8px; background: transparent; cursor: pointer; text-align: left; font-size: 14px;
}
#menu button:hover { background: var(--ui-2); }
#menu kbd, .help kbd {
  font-family: var(--font-ui); font-size: 11.5px; color: var(--muted); background: var(--ui-2);
  border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; white-space: nowrap;
}
#menu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 4px; }
#menu .danger { color: var(--danger); }

/* boards */
.board-btn {
  display: flex; align-items: center; gap: 4px; height: 36px; padding: 0 8px 0 12px; border: 0; border-left: 1px solid var(--line);
  border-radius: 0 8px 8px 0; background: transparent; cursor: pointer; font-size: 14px; font-weight: 500; color: var(--muted);
}
.board-btn:hover { background: var(--ui-2); color: var(--ink); }
.board-btn span { max-width: 22ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.board-btn svg { width: 16px; height: 16px; flex: none; }
#boardsPanel {
  position: fixed; top: calc(60px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px));
  width: min(340px, calc(100% - 32px)); max-height: calc(100% - 140px); display: flex; flex-direction: column; z-index: 20;
}
.bp-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 12px 8px 16px; }
.bp-head h2 { margin: 0; font-family: var(--font-brand); font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
.btn.small { height: 32px; padding: 0 12px; font-size: 13px; }
#boardList { list-style: none; margin: 0; padding: 0 6px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
.board-row { display: flex; align-items: center; gap: 2px; border-radius: 9px; padding-right: 4px; }
.board-row:hover { background: var(--ui-2); }
.board-row[aria-current="true"] { background: var(--accent-soft); }
.board-open {
  flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 1px; padding: 8px 10px;
  border: 0; background: transparent; cursor: pointer; text-align: left;
}
.b-name { font-size: 14px; font-weight: 600; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.board-row[aria-current="true"] .b-name { color: var(--accent); }
.b-meta { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.b-input {
  flex: 1; min-width: 0; margin: 4px 6px; font: inherit; font-size: 14px; font-weight: 600; padding: 6px 8px;
  border: 1px solid var(--accent); border-radius: 7px; background: var(--ui); color: var(--ink);
}
.board-row .icon-btn { width: 32px; height: 32px; color: var(--muted); }
.board-row .icon-btn svg { width: 17px; height: 17px; }
.board-row .icon-btn.armed { width: auto; padding: 0 10px; color: var(--ui); background: var(--danger); font-size: 12.5px; font-weight: 600; }
.bp-foot { padding: 10px 16px 14px; }

/* properties */
#props {
  position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); top: calc(64px + env(safe-area-inset-top, 0px));
  width: 212px; padding: 12px; display: flex; flex-direction: column; gap: 12px;
  max-height: calc(100% - 140px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); overflow-y: auto; z-index: 5;
}
#props h3 { margin: 0 0 6px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.swatches, .seg { display: flex; flex-wrap: wrap; gap: 4px; }
.swatch {
  width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--line); cursor: pointer; padding: 0; position: relative;
}
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ui), 0 0 0 4px var(--accent); }
.swatch.none { background: repeating-conic-gradient(var(--ui-2) 0 25%, var(--ui) 0 50%) 0 0 / 10px 10px; }
.swatch.custom { overflow: hidden; display: grid; place-items: center; background: conic-gradient(#e03131, #f08c00, #2f9e44, #1971c2, #7048e8, #e03131); }
.swatch.custom input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
.seg button {
  min-width: 32px; height: 32px; padding: 0 6px; border-radius: 7px; border: 1px solid var(--line);
  background: var(--ui); cursor: pointer; display: inline-grid; place-items: center; font-size: 13px; font-weight: 600;
}
.seg button:hover { background: var(--ui-2); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.seg svg { width: 20px; height: 20px; }
#opacity { width: 100%; accent-color: var(--accent); }
.range-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* footer */
#footer {
  position: fixed; bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; pointer-events: none;
}
#footer > * { pointer-events: auto; }
.cluster { display: flex; gap: 8px; }
.cluster .island { display: flex; align-items: center; padding: 2px; }
#zoomLabel {
  min-width: 56px; height: 36px; border: 0; background: transparent; cursor: pointer; border-radius: 8px;
  font-size: 13px; font-variant-numeric: tabular-nums;
}
#zoomLabel:hover { background: var(--ui-2); }
#hint {
  align-self: center; font-size: 12.5px; color: var(--muted); text-align: center; pointer-events: none;
  background: color-mix(in srgb, var(--bg) 80%, transparent); padding: 4px 10px; border-radius: 99px;
}

/* text editor */
#editor {
  position: fixed; margin: 0; padding: 0; border: 0; outline: 1px dashed var(--accent); outline-offset: 4px;
  background: transparent; resize: none; overflow: hidden; white-space: pre; font-family: var(--font-hand);
  filter: var(--canvas-filter); z-index: 4; -webkit-user-select: text; user-select: text;
}

/* dialogs */
.modal { position: fixed; inset: 0; background: rgba(15, 20, 35, .4); display: grid; place-items: center; z-index: 40; padding: 16px; }
.dialog { width: min(560px, 100%); max-height: 100%; overflow: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; -webkit-user-select: text; user-select: text; }
.dialog header { display: flex; justify-content: space-between; align-items: center; }
.dialog h2 { margin: 0; font-family: var(--font-brand); font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
.preview {
  border: 1px solid var(--line); border-radius: 10px; min-height: 160px; display: grid; place-items: center; padding: 12px;
  background: repeating-conic-gradient(var(--ui-2) 0 25%, var(--ui) 0 50%) 0 0 / 16px 16px;
}
.preview img { max-height: 280px; object-fit: contain; }
.opts { display: flex; flex-wrap: wrap; gap: 16px; font-size: 14px; align-items: center; }
.opts label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.opts input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; }
.opts select { font: inherit; padding: 4px 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--ui); color: var(--ink); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn {
  height: 38px; padding: 0 14px; border-radius: 9px; border: 1px solid var(--line); background: var(--ui);
  cursor: pointer; font-weight: 600; font-size: 14px;
}
.btn:hover { background: var(--ui-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--ui); }
.btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
.hint-text { margin: 0; font-size: 12.5px; color: var(--muted); }
.help { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 4px 24px; font-size: 13.5px; }
.help h4 { grid-column: 1 / -1; margin: 10px 0 2px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.help div { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; border-bottom: 1px solid var(--line); }

#toast {
  position: fixed; left: 50%; bottom: calc(70px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 9px; font-size: 13.5px; z-index: 50;
  box-shadow: var(--shadow); max-width: calc(100% - 32px);
}

@media (max-width: 760px) {
  .spacer, .brand-name, #hint { display: none; }
  .board-btn span { max-width: 14ch; }
  #topbar { flex-wrap: wrap; }
  #props {
    top: auto; bottom: calc(64px + env(safe-area-inset-bottom, 0px)); width: auto;
    right: max(16px, env(safe-area-inset-right, 0px)); max-height: 34%; flex-direction: row; flex-wrap: wrap;
  }
  #props section { min-width: 0; }
  body:not(.props-open) #props { display: none !important; }
  #styleBtn { display: inline-grid; }
}
#styleBtn { display: none; }
@media (prefers-reduced-motion: no-preference) {
  .icon-btn, .seg button, .btn { transition: background-color .12s, color .12s; }
}
</style>
</head>
<body>
<canvas id="board" aria-label="Drawing canvas"></canvas>
<textarea id="editor" hidden spellcheck="false" aria-label="Edit text"></textarea>

<div id="topbar">
  <div class="island brand">
    <button class="icon-btn" id="menuBtn" aria-label="Menu" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <span class="brand-name">Scrawl</span>
    <button class="board-btn" id="boardBtn" aria-expanded="false" title="Switch board">
      <span id="boardName">Board</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg>
    </button>
  </div>
  <div class="island" id="tools" role="toolbar" aria-label="Tools"></div>
  <div class="spacer"></div>
</div>

<div class="island" id="menu" hidden>
  <button id="mOpen">Open… <kbd>Ctrl O</kbd></button>
  <button id="mSave">Save to file <kbd>Ctrl S</kbd></button>
  <button id="mExport">Export image… <kbd>Ctrl ⇧ E</kbd></button>
  <button id="mImage">Insert image <kbd>9</kbd></button>
  <hr>
  <button id="mGrid">Show grid <kbd>G</kbd></button>
  <button id="mTheme">Dark mode <kbd>⇧ Alt D</kbd></button>
  <button id="mHelp">Keyboard shortcuts <kbd>?</kbd></button>
  <hr>
  <button id="mClear" class="danger">Clear canvas</button>
</div>

<div class="island" id="boardsPanel" hidden>
  <div class="bp-head">
    <h2>Boards</h2>
    <button class="btn small primary" id="newBoardBtn">New board</button>
  </div>
  <ul id="boardList"></ul>
  <p class="hint-text bp-foot">Boards are kept in this browser. Use Save to file to move one to another device.</p>
</div>

<aside class="island" id="props" hidden aria-label="Shape properties"></aside>

<div id="footer">
  <div class="cluster">
    <div class="island">
      <button class="icon-btn" id="zoomOut" aria-label="Zoom out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 12h12"/></svg></button>
      <button id="zoomLabel" title="Reset zoom">100%</button>
      <button class="icon-btn" id="zoomIn" aria-label="Zoom in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 12h12M12 6v12"/></svg></button>
    </div>
    <div class="island">
      <button class="icon-btn" id="undoBtn" aria-label="Undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 010 11H11"/></svg></button>
      <button class="icon-btn" id="redoBtn" aria-label="Redo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 000 11H13"/></svg></button>
    </div>
  </div>
  <div id="hint"></div>
  <div class="island" style="display:flex;padding:2px">
    <button class="icon-btn" id="styleBtn" aria-label="Show style options" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3a9 9 0 100 18c1.1 0 1.6-.9 1.2-1.8-.5-1.2.2-2.4 1.5-2.4H17a4 4 0 004-4c0-5.5-4-9.8-9-9.8z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7" r="1"/><circle cx="15" cy="7.5" r="1"/></svg></button>
    <button class="icon-btn" id="helpBtn" aria-label="Keyboard shortcuts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 114 2c-.9.6-1.5 1.1-1.5 2.2M12 17h.01"/></svg></button>
  </div>
</div>

<div class="modal" id="exportDlg" hidden>
  <div class="island dialog" role="dialog" aria-labelledby="expTitle">
    <header><h2 id="expTitle">Export image</h2><button class="icon-btn" data-close aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
    <div class="preview"><img id="expImg" alt="Preview of the exported drawing"></div>
    <div class="opts">
      <label><input type="checkbox" id="expBg" checked> Paper background</label>
      <label><input type="checkbox" id="expSel"> Only selected</label>
      <label>Scale <select id="expScale"><option value="1">1×</option><option value="2" selected>2×</option><option value="3">3×</option></select></label>
    </div>
    <div class="actions">
      <button class="btn primary" id="expPng">Download PNG</button>
      <button class="btn" id="expSvg">Download SVG</button>
      <button class="btn" id="expCopy">Copy PNG</button>
    </div>
    <p class="hint-text">If downloads are blocked where this page is open, right-click the preview and choose “Save image as”.</p>
  </div>
</div>

<div class="modal" id="helpDlg" hidden>
  <div class="island dialog" role="dialog" aria-labelledby="helpTitle" style="width:min(680px,100%)">
    <header><h2 id="helpTitle">Keyboard shortcuts</h2><button class="icon-btn" data-close aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
    <div class="help" id="helpBody"></div>
  </div>
</div>

<input type="file" id="fileOpen" accept=".scrawl,.json,application/json" hidden>
<input type="file" id="fileImage" accept="image/*" hidden>
<div id="toast" hidden role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js" integrity="sha384-1NLkwxMO2sOqcq7rQkFBhIAUJtbt8ziLxhVKVgKfFGMEU8pF+GEq5LVogviveup6" crossorigin="anonymous"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const canvas = $('#board'), ctx = canvas.getContext('2d');
const rc = rough.canvas(canvas), gen = rc.generator;
const mctx = document.createElement('canvas').getContext('2d');
const ta = $('#editor');

const PAPER = '#fcfcfd', ACCENT = '#2f5bea', GRID = 20, LH = 1.25;
const SHAPES = new Set(['rectangle', 'diamond', 'ellipse']);
const isLinear = t => t === 'line' || t === 'arrow';
const uid = () => Math.random().toString(36).slice(2, 10);
const rand = () => Math.floor(Math.random() * 2 ** 31);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fontStr = fs => `${fs}px Kalam, "Comic Sans MS", cursive`;

// ---------- state ----------
let elements = [];
const st = {
  tool: 'selection', locked: false, zoom: 1, sx: 0, sy: 0, sel: new Set(), grid: false,
  style: { stroke: '#1f2328', bg: 'transparent', fill: 'hachure', sw: 2, ss: 'solid', rough: 1, round: true, opacity: 100, fontSize: 28 },
};
let drag = null, pinch = null, editing = null, spaceDown = false, lastWorld = { x: 200, y: 200 };
const pointers = new Map();
const erasing = new Set();
const byId = id => elements.find(e => e.id === id);
const selected = () => elements.filter(e => st.sel.has(e.id));
const touch = el => { el.v = (el.v || 0) + 1; };

// ---------- geometry ----------
function bounds(el) {
  if (el.points) {
    let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
    for (const [px, py] of el.points) { x1 = Math.min(x1, px); y1 = Math.min(y1, py); x2 = Math.max(x2, px); y2 = Math.max(y2, py); }
    return { x: el.x + x1, y: el.y + y1, w: x2 - x1, h: y2 - y1 };
  }
  return { x: el.x, y: el.y, w: el.w, h: el.h };
}

  els.push(makeEl('arrow', { x: 515, y: 296 }, { ...base, stroke: '#c92a2a', ss: 'dashed', points: [[0, 0], [-300, 80], [-325, -18]] }));
  els.push(makeEl('text', { x: 330, y: 360 }, { text: 'no? back to the napkin', fontSize: 20, stroke: '#c92a2a', opacity: 100 }));
  els.push(makeEl('text', { x: 80, y: 450 }, { text: 'This board is a sample. Press 2 and drag to add a box,\nor double-click anywhere to write.', fontSize: 20, stroke: '#5d6577', opacity: 100 }));
  return els;
}

// ---------- boards ----------
function ago(ts) {
  const s = (Date.now() - ts) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return `${Math.floor(s / 60)} min ago`;
  if (s < 86400) return `${Math.floor(s / 3600)} h ago`;
  if (s < 86400 * 7) return `${Math.floor(s / 86400)} d ago`;
  return new Date(ts).toLocaleDateString();
}
function nextBoardName() {
  let n = boards.length + 1;
  while (boards.some(b => b.name === `Board ${n}`)) n++;
  return `Board ${n}`;
}
function openBoard(id, fit = false) {
  if (editing) commitText();
  if (boardId && boardId !== id) saveNow();
  const d = store.get(boardKey(id)) || {};
  boardId = id;
  elements = Array.isArray(d.elements) ? d.elements : [];
  lastSnap = JSON.stringify(elements); undoStack = []; redoStack = []; st.sel.clear(); dcache.clear(); erasing.clear();
  try { if (location.hash.slice(1) !== id) history.replaceState(null, '', '#' + id); } catch {}
  $('#boardName').textContent = currentBoard()?.name || 'Board';
  document.title = `${currentBoard()?.name || 'Board'} · Scrawl`;
  if (d.view && !fit) { st.sx = d.view.sx; st.sy = d.view.sy; st.zoom = d.view.zoom; afterView(); }
  else zoomToFit(false, 1);
  saveNow(); updateUI(); redraw();
}
function newBoard(name, els = []) {
  const b = { id: uid(), name: name || nextBoardName(), updated: Date.now(), count: els.length };
  boards.unshift(b);
  store.set(boardKey(b.id), { elements: els });
  openBoard(b.id, true);
  renderBoards();
  return b;
}
function renameBoard(id, name) {
  const b = boards.find(x => x.id === id); name = name.trim().slice(0, 80);
  if (!b || !name || name === b.name) return;
  b.name = name;
  if (id === boardId) { $('#boardName').textContent = name; document.title = `${name} · Scrawl`; }
  store.set(BOARDS_KEY, boards);
}
function deleteBoard(id) {
  const b = boards.find(x => x.id === id); if (!b) return;
  boards = boards.filter(x => x !== b);
  store.del(boardKey(id)); store.set(BOARDS_KEY, boards);
  if (!boards.length) newBoard();
  else if (id === boardId) { boardId = null; openBoard(sortedBoards()[0].id); }
  renderBoards(); toast(`Deleted “${b.name}”`);
}
const sortedBoards = () => [...boards].sort((a, b) => (b.updated || 0) - (a.updated || 0));
const PENCIL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l1-4.5L15.5 5a2.1 2.1 0 013 3L8 18.5z"/></svg>';
const TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></svg>';
function renderBoards() {
  const list = $('#boardList');
  list.replaceChildren(...sortedBoards().map(b => {
    const li = document.createElement('li');
    li.className = 'board-row'; li.dataset.id = b.id; li.setAttribute('aria-current', String(b.id === boardId));
    const open = document.createElement('button');
    open.className = 'board-open'; open.dataset.act = 'open';
    const nm = document.createElement('span'); nm.className = 'b-name'; nm.textContent = b.name;
    const meta = document.createElement('span'); meta.className = 'b-meta';
    const n = b.count ?? 0;
    meta.textContent = `${n} ${n === 1 ? 'shape' : 'shapes'} · edited ${ago(b.updated || Date.now())}`;
    open.append(nm, meta);
    li.append(open);
    li.insertAdjacentHTML('beforeend',
      `<button class="icon-btn" data-act="rename" aria-label="Rename board" title="Rename">${PENCIL}</button>` +
      `<button class="icon-btn" data-act="delete" aria-label="Delete board" title="Delete">${TRASH}</button>`);
    return li;
  }));
}
function closeBoards() { boardsPanel.hidden = true; $('#boardBtn').setAttribute('aria-expanded', 'false'); }
$('#boardBtn').addEventListener('click', () => {
  const open = boardsPanel.hidden; closeMenu(); closeBoards();
  if (open) { saveNow(); renderBoards(); boardsPanel.hidden = false; $('#boardBtn').setAttribute('aria-expanded', 'true'); }
});
$('#newBoardBtn').addEventListener('click', () => { newBoard(); closeBoards(); toast('New board ready'); });
document.addEventListener('pointerdown', e => {
  if (!boardsPanel.hidden && !boardsPanel.contains(e.target) && !e.target.closest('#boardBtn')) closeBoards();
});
$('#boardList').addEventListener('click', e => {
  const btn = e.target.closest('button[data-act]'); if (!btn) return;
  const row = btn.closest('.board-row'), id = row.dataset.id, act = btn.dataset.act;
  if (act === 'open') { if (id !== boardId) openBoard(id); closeBoards(); }
  else if (act === 'rename') startRename(row, id);
  else if (act === 'delete') {
    if (!btn.classList.contains('armed')) {
      btn.classList.add('armed'); btn.textContent = 'Delete?'; btn.setAttribute('aria-label', 'Confirm delete');
      setTimeout(() => { if (btn.isConnected) renderBoards(); }, 3000);
    } else deleteBoard(id);
  }
});
function startRename(row, id) {
  const b = boards.find(x => x.id === id); if (!b) return;
  const input = document.createElement('input');
  input.className = 'b-input'; input.value = b.name; input.maxLength = 80; input.id = 'rename-' + id;
  input.setAttribute('aria-label', 'Board name');
  row.querySelector('.board-open').replaceWith(input);
  input.focus(); input.select();
  let done = false;
  const finish = save => { if (done) return; done = true; if (save) renameBoard(id, input.value); renderBoards(); };
  input.addEventListener('keydown', e => { if (e.key === 'Enter') finish(true); else if (e.key === 'Escape') { e.stopPropagation(); finish(false); } });
  input.addEventListener('blur', () => finish(true));
}
window.addEventListener('hashchange', () => {
  const id = location.hash.slice(1);
  if (id && id !== boardId && boards.some(b => b.id === id)) openBoard(id);
});
// another tab added, renamed or removed a board
window.addEventListener('storage', e => {
  if (e.key !== BOARDS_KEY) return;
  const list = store.get(BOARDS_KEY);
  if (!Array.isArray(list)) return;
  const mine = currentBoard();
  boards = list;
  if (mine && !boards.some(b => b.id === mine.id)) boards.unshift(mine);
  $('#boardName').textContent = currentBoard()?.name || 'Board';
  if (!boardsPanel.hidden) renderBoards();
});

// ---------- boot ----------
function boot() {
  const prefs = store.get(PREFS_KEY);
  boards = store.get(BOARDS_KEY) || [];
  if (!boards.length) {
    const legacy = store.get(LEGACY_KEY);
    if (legacy && Array.isArray(legacy.elements)) {
      // drawings saved before boards existed become the first board
      Object.assign(st.style, legacy.style || {}); st.grid = !!legacy.grid;
      const b = { id: uid(), name: 'My board', updated: Date.now(), count: legacy.elements.length };
      boards = [b]; store.set(boardKey(b.id), { elements: legacy.elements, view: legacy.view }); store.del(LEGACY_KEY);
    } else {
      const b = { id: uid(), name: 'Saturday napkin', updated: Date.now(), count: 0 };
      const els = sampleScene(); b.count = els.length;
      boards = [b]; store.set(boardKey(b.id), { elements: els });
    }
    store.set(BOARDS_KEY, boards);
  }
  if (prefs) { Object.assign(st.style, prefs.style || {}); st.grid = !!prefs.grid; }
  const want = location.hash.slice(1), last = store.get(ACTIVE_KEY);
  const id = boards.some(b => b.id === want) ? want : boards.some(b => b.id === last) ? last : sortedBoards()[0].id;
  resize();
  openBoard(id);
  setCursor(toolCursor()); updateUI(); redraw();
}
const fontsReady = document.fonts ? Promise.race([document.fonts.load('28px Kalam'), new Promise(r => setTimeout(r, 2500))]) : Promise.resolve();
fontsReady.then(() => {
  boot();
  // remeasure once the hand font is definitely in, so saved text boxes fit their glyphs
  document.fonts && document.fonts.ready.then(() => { elements.forEach(el => { if (el.type === 'text') { measure(el); } }); redraw(); });
});
})();
</script>
